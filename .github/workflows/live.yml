name: live

on:
  push:
    branches: [ci/live-localnet]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  LICENSING_DAR: testdata/live/quickstart-licensing-0.0.1.dar

jobs:
  live:
    name: Live suites against LocalNet
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Record the start of the job
        run: .github/scripts/phase.sh start

      - name: Compile every live suite before LocalNet takes the memory
        run: |
          set -euo pipefail
          cargo test --no-run --all-features -p canton-ledger --test live
          cargo test --no-run --all-features -p canton-ledger --test interactive_live
          cargo test --no-run --all-features -p canton-admin --test live
          cargo test --no-run --all-features -p canton-pqs --test live
          cargo test --no-run --all-features -p canton-token --test live

      - name: Record the end of compilation
        run: .github/scripts/phase.sh compiled

      - name: Measure disk and memory after compilation
        run: .github/scripts/headroom.sh after-compile

      - name: Boot LocalNet with validator a and PQS
        uses: peacefulstudio/canton-localnet@f4158fccaea2bd2248f37c6b361ed3f37d478dcf # v0.8.4-2
        with:
          validators: a
          pqs: true
          party: true
          cli: source

      - name: Record the end of the LocalNet boot
        run: .github/scripts/phase.sh booted

      - name: Measure disk and memory after the LocalNet boot
        run: .github/scripts/headroom.sh after-boot

      - name: Map CANTON_LOCALNET exports to the CANTON_TEST names the live suites read
        run: |
          set -euo pipefail
          slot=CANTON_LOCALNET_A_VALIDATOR_1
          export_of() { printenv "${slot}_$1"; }
          {
            echo "CANTON_TEST_ENDPOINT=$(export_of GRPC_URL)"
            echo "CANTON_TEST_JSON_ENDPOINT=$(export_of JSON_API_URL)"
            echo "CANTON_TEST_TOKEN_URL=$(export_of TOKEN_URL)"
            echo "CANTON_TEST_CLIENT_ID=$(export_of CLIENT_ID)"
            echo "CANTON_TEST_CLIENT_SECRET=$(export_of CLIENT_SECRET)"
            echo "CANTON_TEST_ADMIN_CLIENT_ID=$(export_of CLIENT_ID)"
            echo "CANTON_TEST_ADMIN_CLIENT_SECRET=$(export_of CLIENT_SECRET)"
            echo "CANTON_TEST_ADMIN_ENDPOINT=$(export_of ADMIN_GRPC_URL)"
            echo "CANTON_TEST_PARTY=$(export_of PARTY)"
            echo "CANTON_TOKEN_REGISTRY_URL=${CANTON_LOCALNET_SCAN_URL}"
            echo "CANTON_PQS_URL=host=$(export_of PQS_HOST) port=$(export_of PQS_PORT) user=$(export_of PQS_USER) password=$(export_of PQS_PASSWORD) dbname=$(export_of PQS_DATABASE)"
          } >> "$GITHUB_ENV"

      - name: Measure whether scan.localhost resolves and answers on the runner
        run: |
          getent hosts scan.localhost || echo "scan.localhost does not resolve through getent"
          curl -sS -o /dev/null -w "scan.localhost:10000 registry info -> HTTP %{http_code}\n" \
            --max-time 20 "${CANTON_LOCALNET_SCAN_URL}/registry/metadata/v1/info" || echo "curl to scan.localhost failed"

      - name: Verify and upload the quickstart-licensing DAR through the JSON Ledger API (workaround, canton-localnet v0.8.4-2 has no DAR upload command)
        run: |
          set -euo pipefail
          (cd "$(dirname "$LICENSING_DAR")" && sha256sum -c "$(basename "$LICENSING_DAR").sha256")
          token=$(curl -fsS "$CANTON_TEST_TOKEN_URL" \
            -d grant_type=client_credentials \
            -d client_id="$CANTON_TEST_ADMIN_CLIENT_ID" \
            -d client_secret="$CANTON_TEST_ADMIN_CLIENT_SECRET" | jq -r .access_token)
          echo "::add-mask::$token"
          curl -fsS -X POST "$CANTON_TEST_JSON_ENDPOINT/v2/packages" \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${LICENSING_DAR}"
          echo "CANTON_TEST_LICENSING_PKG=#quickstart-licensing" >> "$GITHUB_ENV"

      - name: Fund the validator wallet with Amulet
        run: canton-localnet tap --slot a --at-least 1000

      - name: Wait until PQS has ingested an active Amulet (workaround, canton-localnet v0.8.4-2 has no PQS readiness wait after tap)
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends postgresql-client >/dev/null
          for attempt in $(seq 1 60); do
            count=$(psql "$CANTON_PQS_URL" -Atc "select count(*) from active('splice-amulet:Splice.Amulet:Amulet')" 2>&1 || true)
            echo "attempt $attempt: $count"
            if [[ "$count" =~ ^[0-9]+$ ]] && [ "$count" -gt 0 ]; then
              .github/scripts/phase.sh amulet-in-pqs
              exit 0
            fi
            sleep 5
          done
          echo "::error::PQS never reported an active Amulet"
          exit 1

      - name: Open the per-suite results table
        run: |
          {
            echo "### Live suites"
            echo "| suite | result | counts | wall time |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          .github/scripts/phase.sh suites-start

      - name: Run canton-ledger live suite
        env:
          CANTON_TEST_REQUIRE_LIVE: "1"
        run: .github/scripts/live-suite.sh ledger-live -p canton-ledger --test live

      - name: Run canton-ledger interactive submission suite
        env:
          CANTON_TEST_REQUIRE_LIVE: "1"
        run: .github/scripts/live-suite.sh ledger-interactive -p canton-ledger --test interactive_live

      - name: Run canton-admin live suite
        env:
          CANTON_TEST_REQUIRE_LIVE: "1"
        run: .github/scripts/live-suite.sh admin -p canton-admin --test live

      - name: Run canton-pqs live suite
        env:
          CANTON_TEST_REQUIRE_LIVE: "1"
        run: .github/scripts/live-suite.sh pqs -p canton-pqs --test live

      - name: Run canton-token live suite
        env:
          CANTON_TEST_REQUIRE_LIVE: "1"
        run: .github/scripts/live-suite.sh token -p canton-token --test live

      - name: Tear down LocalNet
        if: always()
        uses: peacefulstudio/canton-localnet/teardown@f4158fccaea2bd2248f37c6b361ed3f37d478dcf # v0.8.4-2

      - name: Summarise phase timings
        if: always()
        run: |
          {
            echo "### Phase timings (seconds since previous phase)"
            echo '```'
            awk -v now="$(date +%s)" '
              NR == 1 { first = $2 }
              { if (NR > 1) printf "%-16s +%ds\n", $1, $2 - previous; previous = $2 }
              END { printf "%-16s +%ds\ntotal            %ds\n", "teardown", now - previous, now - first }
            ' "$RUNNER_TEMP/phases.log"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
